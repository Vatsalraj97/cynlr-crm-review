    * { margin: 0; padding: 0; box-sizing: border-box; }

    header {
      padding: 13px 20px;
      background: #161b22;
      border-bottom: 1px solid #30363d;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;

    header p { font-size: 12px; color: #8b949e; margin-top: 2px; }
    .zoom-hint {

      color: #58a6ff;
      background: rgba(88,166,255,0.1);
      border: 1px solid rgba(88,166,255,0.3);
      padding: 5px 12px;
      border-radius: 20px;
    }

    #map { width: 100%; height: 100%; }

      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      z-index: 500;
      overflow: hidden;
    }

    .person-card {
      position: absolute;
      transform: translate(-50%, -50%);
      background: rgba(13, 17, 23, 0.92);
      border: 1px solid #30363d;
      border-radius: 22px;
      padding: 5px 10px 5px 5px;
      display: flex;
      align-items: center;
      gap: 7px;
      pointer-events: auto;
      cursor: pointer;
      white-space: nowrap;
      backdrop-filter: blur(12px);
      transition: border-color 0.15s, background 0.15s, box-shadow 0.15s, transform 0.15s;
      animation: popIn 0.25s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
      box-shadow: 0 2px 12px rgba(0,0,0,0.4);
    }
    .person-card:hover {
      background: rgba(22, 27, 34, 0.98);
      box-shadow: 0 4px 20px rgba(0,0,0,0.6);
      transform: translate(-50%, -50%) scale(1.08);
      z-index: 9999 !important;
    }
    .person-card.dutch {
      border-color: #f97316;
      box-shadow: 0 0 0 1px rgba(249,115,22,0.3), 0 2px 12px rgba(0,0,0,0.4);
    }

      width: 26px; height: 26px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 10px; font-weight: 700; color: #fff;
      flex-shrink: 0;
    }

    .pr { font-size: 10px; color: #8b949e; line-height: 1.2; }
    .flag { font-size: 12px; margin-left: 2px; }

    /* connector line between pin and card */
    .connector {
      position: absolute;
      pointer-events: none;
      z-index: 499;
    }

    @keyframes popIn {
      0%   { opacity: 0; transform: translate(-50%, -50%) scale(0.5); }
      100% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    }

    /* ─── Detail panel ─── */

      position: absolute;
      top: 16px; right: 16px;
      z-index: 1000;
      width: 260px;
      background: rgba(22, 27, 34, 0.97);
      border: 1px solid #30363d;
      border-radius: 14px;
      padding: 16px;
      backdrop-filter: blur(16px);
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
      display: none;
      animation: slideIn 0.2s ease;
    }
    #detail-panel.visible { display: block; }
    @keyframes slideIn {
      from { opacity: 0; transform: translateY(-8px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .dp-close {
      position: absolute; top: 10px; right: 12px;

      font-size: 18px; cursor: pointer; line-height: 1;

    .dp-note { font-size: 12px; color: #c9d1d9; line-height: 1.6; }

      background: rgba(249,115,22,0.15);
      border: 1px solid rgba(249,115,22,0.4);
      padding: 3px 10px; border-radius: 12px;
      font-size: 11px; color: #f97316; font-weight: 600;

      border-radius: 10px;

      background: #161b22 !important;
      border: 1px solid #30363d !important;
      border-radius: 10px !important;

    .popup-company { font-size: 14px; font-weight: 700; color: #f0f6fc; margin-bottom: 3px; }

  return L.divIcon({
    className: '',
    html: `<svg width="28" height="36" viewBox="0 0 28 36" xmlns="http://www.w3.org/2000/svg">
      <path d="M14 0C6.268 0 0 6.268 0 14c0 9.333 14 22 14 22S28 23.333 28 14C28 6.268 21.732 0 14 0z" fill="${color}" opacity="0.95"/>
      <circle cx="14" cy="14" r="6" fill="white" opacity="0.9"/>
    </svg>`,
    iconSize: [28, 36], iconAnchor: [14, 36], popupAnchor: [0, -40]
  });
}

    <div>${tags.map(t => `<span class="popup-tag" style="background:${c}22;color:${c}">${t}</span>`).join(' ')}</div>

// ─── People overlay system ───

const ZOOM_SHOW = 7;   // people appear at this zoom
const ZOOM_FULL = 9;   // full fan at this zoom
const overlay = document.getElementById('people-overlay');
const zoomHint = document.getElementById('zoom-hint');

let personEls = []; // { el, lat, lng, ox, oy }
let rafId = null;
let svgEl = null;

function initials(name) {
  return name.replace(/[^A-Za-z ]/g, '').split(' ')
    .filter(w => w.length > 0 && w[0] === w[0].toUpperCase())
    .slice(0, 2).map(w => w[0]).join('') || name.slice(0,2).toUpperCase();
}

function getFanOffset(i, total) {
  const r = Math.max(78, 62 + total * 7);
  if (total === 1) return { x: 0, y: -(r + 20) };
  // Arc above the pin: from ~210° to ~330° in screen coords
  const startA = (210 * Math.PI) / 180;
  const endA   = (330 * Math.PI) / 180;
  const angle  = startA + (i / (total - 1)) * (endA - startA);
  return { x: Math.cos(angle) * r, y: Math.sin(angle) * r - 20 };
}

function buildOverlay() {
  overlay.innerHTML = '';
  personEls = [];

  const zoom = map.getZoom();
  if (zoom < ZOOM_SHOW) {
    zoomHint.textContent = '🔍 Zoom in to reveal key people';
    zoomHint.style.opacity = '1';
    return;
  }

  zoomHint.textContent = '👤 Click any floating card to see details';
  zoomHint.style.opacity = '0.7';

  // Create SVG connector layer
  svgEl = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svgEl.style.cssText = 'position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:498;overflow:visible;';
  overlay.appendChild(svgEl);

  locations.forEach(loc => {
    if (!loc.people || loc.people.length === 0) return;
    const color = colors[loc.type];

    loc.people.forEach((person, pi) => {
      const { x: ox, y: oy } = getFanOffset(pi, loc.people.length);

      // Card element
      const card = document.createElement('div');
      card.className = 'person-card' + (person.dutch ? ' dutch' : '');
      card.style.setProperty('--color', color);
      card.style.borderColor = color + '55';
      card.style.animationDelay = (pi * 40) + 'ms';

      const av = document.createElement('div');
      av.className = 'pa';
      av.style.background = color;
      av.textContent = initials(person.name);

      const info = document.createElement('div');
      info.innerHTML = `<div class="pn">${person.name}</div><div class="pr">${person.role}</div>`;

      card.appendChild(av);
      card.appendChild(info);
      if (person.dutch) {
        const flag = document.createElement('span');
        flag.className = 'flag';
        flag.textContent = '🇳🇱';
        card.appendChild(flag);
      }

      card.addEventListener('click', e => {
        e.stopPropagation();
        showDetail(person, loc, color);
      });

      overlay.appendChild(card);

      // SVG line (will be positioned in positionAll)
      const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
      line.setAttribute('stroke', color);
      line.setAttribute('stroke-width', '1');
      line.setAttribute('stroke-opacity', '0.3');
      line.setAttribute('stroke-dasharray', '3,3');
      svgEl.appendChild(line);

      personEls.push({ card, line, lat: loc.lat, lng: loc.lng, ox, oy });
    });
  });

  positionAll();
}

function positionAll() {
  personEls.forEach(({ card, line, lat, lng, ox, oy }) => {
    const pt = map.latLngToContainerPoint([lat, lng]);
    const cx = pt.x + ox;
    const cy = pt.y + oy;

    card.style.left = cx + 'px';
    card.style.top  = cy + 'px';

    // pin tip is at pt (bottom of 36px icon = pt.y, center is pt.y - 18)
    const pinX = pt.x;
    const pinY = pt.y - 18;
    line.setAttribute('x1', pinX);
    line.setAttribute('y1', pinY);
    line.setAttribute('x2', cx);
    line.setAttribute('y2', cy);
  });
}

function rafPosition() {
  if (rafId) cancelAnimationFrame(rafId);
  rafId = requestAnimationFrame(positionAll);
}

map.on('zoomend', buildOverlay);
map.on('move',    rafPosition);

// Initial build
buildOverlay();

// ─── Detail panel ───
function showDetail(person, loc, color) {
  document.getElementById('dp-avatar').style.background = color;
  document.getElementById('dp-avatar').textContent = initials(person.name);
  document.getElementById('dp-name').textContent = person.name;
  document.getElementById('dp-role').textContent = person.role;
  document.getElementById('dp-role').style.color = color;
  const m = loc.popup.match(/class="popup-company">(.*?)<\/div>/); document.getElementById('dp-company').textContent = '📍 ' + (m ? m[1] : '');
  document.getElementById('dp-note').textContent = person.note;
  const dutchEl = document.getElementById('dp-dutch');
  dutchEl.style.display = person.dutch ? 'inline-flex' : 'none';

  const panel = document.getElementById('detail-panel');
  panel.classList.remove('visible');
  void panel.offsetWidth; // reflow to re-trigger animation
  panel.classList.add('visible');
}

function closeDetail() {
  document.getElementById('detail-panel').classList.remove('visible');
}

map.on('click', closeDetail);
</script>
